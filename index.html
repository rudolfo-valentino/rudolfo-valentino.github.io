<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сигнал в Уране — Мультивселенная Рудолфо Валентино</title>
  <meta name="description" content="Сигнал в Уране — мультивселенная Рудолфо Валентино: 12 книг, 4 трилогии, мультитранзитная проза. Signal in Uranus: 12 books by Rudolfo Valentino." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap');

    :root{
      --gold:#c9a84c; --cyan:#00e5ff; --violet:#7c3aed; --rose:#fb7185;
      --dark:#07080f; --card-bg:rgba(255,255,255,0.04);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--dark);color:#e8e8f0;font-family:'Raleway',sans-serif;overflow-x:hidden;}

    #stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

    /* language toggle */
    .lang-toggle{
      position:fixed;top:18px;right:18px;z-index:50;
      display:flex;gap:2px;background:rgba(10,12,22,.7);
      border:1px solid rgba(255,255,255,.12);border-radius:30px;padding:3px;backdrop-filter:blur(8px);
    }
    .lang-toggle button{
      background:none;border:none;color:#8a93ad;font-family:'Orbitron',monospace;font-size:.72rem;
      letter-spacing:.1em;padding:.4rem .8rem;border-radius:26px;cursor:pointer;transition:.2s;
    }
    .lang-toggle button.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;}

    /* HERO */
    .hero{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:2rem;
      background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(124,58,237,.18)0%,rgba(0,229,255,.06)50%,transparent 100%);}
    .hero-eyebrow{font-family:'Orbitron',monospace;font-size:.75rem;letter-spacing:.35em;color:var(--cyan);
      text-transform:uppercase;margin-bottom:1.2rem;opacity:.8;}
    .hero-title{font-family:'Orbitron',monospace;font-size:clamp(2.4rem,7vw,5.5rem);font-weight:900;line-height:1.05;
      background:linear-gradient(135deg,#fff 30%,var(--cyan)70%,var(--gold));-webkit-background-clip:text;
      -webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(0,229,255,.35));}
    .hero-subtitle{margin-top:1rem;font-size:1.15rem;font-weight:300;color:#b0b8d0;letter-spacing:.06em;}
    .hero-founder{margin-top:.5rem;font-size:.95rem;color:#8fa0c0;}
    .hero-founder strong{color:var(--gold);font-weight:600;}
    .hero-author{margin-top:1rem;font-family:'Orbitron',monospace;font-size:.85rem;color:var(--gold);letter-spacing:.2em;}
    .hero-coauthor{margin-top:.5rem;font-size:.8rem;color:#7c8aa8;letter-spacing:.04em;}
    .hero-coauthor strong{color:var(--cyan);font-weight:600;}
    .scroll-hint{margin-top:3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;opacity:.5;
      font-size:.75rem;letter-spacing:.2em;animation:pulse 2.5s ease-in-out infinite;}
    .scroll-hint::after{content:'▼';font-size:1rem;}
    @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:.7;}}

    section{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:5rem 2rem;}
    .section-label{font-family:'Orbitron',monospace;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;
      color:var(--cyan);opacity:.7;margin-bottom:.6rem;}
    .section-title{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:700;margin-bottom:2.5rem;}

    /* universe map */
    .universe-map{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;}
    .umap-cell{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:10px;
      padding:.9rem;text-align:center;font-size:.78rem;transition:background .25s;}
    .umap-cell:hover{background:rgba(255,255,255,.07);}
    .umap-cell .num{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;display:block;margin-bottom:.25rem;}
    .umap-cell.t1 .num{color:var(--gold);}.umap-cell.t2 .num{color:var(--cyan);}
    .umap-cell.t3 .num{color:#a78bfa;}.umap-cell.t4 .num{color:var(--rose);}

    /* trilogy */
    .trilogy{margin-bottom:4.5rem;}
    .trilogy-header{display:flex;align-items:center;gap:1.2rem;margin-bottom:2rem;}
    .trilogy-num{font-family:'Orbitron',monospace;font-size:2.6rem;font-weight:900;opacity:.13;line-height:1;}
    .trilogy-name{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;}
    .trilogy-divider{flex:1;height:1px;opacity:.15;}
    .t1 .trilogy-name{color:var(--gold);}.t1 .trilogy-divider{background:var(--gold);}
    .t2 .trilogy-name{color:var(--cyan);}.t2 .trilogy-divider{background:var(--cyan);}
    .t3 .trilogy-name{color:#a78bfa;}.t3 .trilogy-divider{background:#a78bfa;}
    .t4 .trilogy-name{color:var(--rose);}.t4 .trilogy-divider{background:var(--rose);}

    .books-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;}
    .book-card{background:var(--card-bg);border:1px solid rgba(255,255,255,.06);border-radius:16px;
      padding:1.3rem 1.3rem 1.6rem;transition:transform .3s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column;}
    .book-card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .t1 .book-card:hover{border-color:rgba(201,168,76,.4);}
    .t2 .book-card:hover{border-color:rgba(0,229,255,.4);}
    .t3 .book-card:hover{border-color:rgba(167,139,250,.4);}
    .t4 .book-card:hover{border-color:rgba(251,113,133,.4);}
    .book-cover{display:block;width:100%;height:auto;border-radius:12px;margin-bottom:1.1rem;box-shadow:0 12px 34px rgba(0,0,0,.55);}
    .book-number{font-family:'Orbitron',monospace;font-size:.7rem;letter-spacing:.3em;opacity:.45;margin-bottom:.5rem;}
    .book-title{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;line-height:1.3;margin-bottom:.7rem;}
    .t1 .book-title{color:#e8c96a;}.t2 .book-title{color:#67e8f9;}
    .t3 .book-title{color:#c4b5fd;}.t4 .book-title{color:#fda4af;}
    .book-desc{font-size:.86rem;line-height:1.6;color:#8899b0;font-weight:300;flex:1;margin-bottom:1.1rem;}
    .book-dl{display:inline-flex;align-items:center;gap:.5rem;align-self:flex-start;padding:.55rem 1.1rem;border-radius:8px;
      font-family:'Orbitron',monospace;font-size:.68rem;letter-spacing:.12em;text-decoration:none;
      border:1px solid rgba(255,255,255,.18);color:#cfd6e6;transition:.25s;}
    .book-dl:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);}

    /* omnibus */
    .omnibus{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:2rem;}
    .omnibus-box{display:grid;grid-template-columns:220px 1fr;gap:2.5rem;align-items:center;
      background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(124,58,237,.08),rgba(0,229,255,.06));
      border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:2.5rem;}
    .omnibus-cover{width:100%;height:auto;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);}
    .omnibus-badge{font-family:'Orbitron',monospace;font-size:.7rem;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;margin-bottom:.7rem;}
    .omnibus-title{font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;margin-bottom:.9rem;
      background:linear-gradient(135deg,var(--gold),#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .omnibus-desc{font-size:.95rem;line-height:1.7;color:#aab4cc;margin-bottom:1.4rem;}
    .omnibus-dl{display:inline-flex;align-items:center;gap:.6rem;padding:.75rem 1.6rem;border-radius:9px;
      font-family:'Orbitron',monospace;font-size:.75rem;letter-spacing:.12em;text-decoration:none;color:#0a0a14;
      background:linear-gradient(135deg,var(--gold),#e8c96a);font-weight:700;transition:.25s;}
    .omnibus-dl:hover{filter:brightness(1.12);transform:translateY(-2px);}

    /* about */
    .about-box{background:var(--card-bg);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:3rem;
      display:grid;grid-template-columns:auto 1fr;gap:2.5rem;align-items:start;}
    .about-avatar{width:120px;height:120px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;
      box-shadow:0 0 30px rgba(201,168,76,.3);flex-shrink:0;}
    .about-name{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:.5rem;}
    .about-text{font-size:.95rem;line-height:1.75;color:#9aa8c0;}
    .about-text strong{color:var(--gold);}
    .about-credit{margin-top:1.2rem;font-size:.9rem;line-height:1.6;color:#8899b0;padding:.8rem 1rem;
      border-left:2px solid rgba(0,229,255,.4);background:rgba(0,229,255,.04);border-radius:0 8px 8px 0;}
    .about-credit strong{color:var(--cyan);font-weight:600;}
    .about-contact{margin-top:1.4rem;font-size:.92rem;color:#9aa8c0;}
    .about-contact a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(201,168,76,.35);transition:.2s;}
    .about-contact a:hover{border-bottom-color:var(--gold);}
    .about-cta{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.4rem;padding:.65rem 1.4rem;
      border:1px solid rgba(201,168,76,.5);border-radius:8px;color:var(--gold);font-family:'Orbitron',monospace;
      font-size:.75rem;letter-spacing:.15em;text-decoration:none;transition:.25s;}
    .about-cta:hover{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.9);}

    .signal-line{position:relative;z-index:1;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      opacity:.2;margin:0 auto;max-width:800px;}
    footer{position:relative;z-index:1;text-align:center;padding:3rem 2rem;font-size:.8rem;color:#3a4055;letter-spacing:.1em;}
    footer span{color:var(--gold);}

    @media(max-width:700px){
      .universe-map{grid-template-columns:repeat(3,1fr);}
      .about-box{grid-template-columns:1fr;}
      .omnibus-box{grid-template-columns:1fr;text-align:center;}
      .omnibus-cover{max-width:220px;margin:0 auto;}
    }
  </style>
</head>
<body>
<canvas id="stars-canvas"></canvas>

<div class="lang-toggle">
  <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
  <button id="btn-ru" onclick="setLang('ru')">RU</button>
</div>

<div class="hero">
  <p class="hero-eyebrow" id="h-eyebrow"></p>
  <h1 class="hero-title" id="h-title"></h1>
  <p class="hero-subtitle" id="h-subtitle"></p>
  <p class="hero-founder" id="h-founder"></p>
  <p class="hero-author">— <span id="h-author"></span></p>
  <p class="hero-coauthor" id="h-coauthor"></p>
  <div class="scroll-hint" id="h-scroll"></div>
</div>

<section>
  <p class="section-label" id="map-label"></p>
  <h2 class="section-title" id="map-title"></h2>
  <div class="universe-map" id="universe-map"></div>
</section>

<div class="signal-line"></div>

<section id="trilogies"></section>

<div class="signal-line"></div>

<div class="omnibus">
  <p class="section-label" style="text-align:center" id="omni-label"></p>
  <h2 class="section-title" style="text-align:center" id="omni-heading"></h2>
  <div class="omnibus-box">
    <div id="omni-cover"></div>
    <div>
      <p class="omnibus-badge" id="omni-badge"></p>
      <h3 class="omnibus-title" id="omni-title"></h3>
      <p class="omnibus-desc" id="omni-desc"></p>
      <a class="omnibus-dl" href="books/melissa.pdf" download id="omni-dl"></a>
    </div>
  </div>
</div>

<div class="signal-line"></div>

<section>
  <p class="section-label" id="about-label"></p>
  <h2 class="section-title" id="about-title"></h2>
  <div class="about-box">
    <img class="about-avatar" src="author.jpg" alt="Рудолфо Валентино / Rudolfo Valentino" />
    <div>
      <p class="about-name" id="about-name"></p>
      <p class="about-text" id="about-lead"></p>
      <p class="about-text" id="about-bio" style="margin-top:1rem;"></p>
      <p class="about-credit" id="about-credit"></p>
      <p class="about-contact" id="about-contact"></p>
    </div>
  </div>
</section>

<div class="signal-line"></div>
<footer>
  <p id="foot-1"></p>
  <p id="foot-2" style="margin-top:.5rem;font-size:.7rem;opacity:.5;"></p>
</footer>

<script>
/* ---------- DATA ---------- */
const TRILOGIES = [
  {roman:'I',  cls:'t1', ru:'Протокол Λ',       en:'Protocol Λ',       accent:'#c9a84c', light:'#e8c96a', bg2:'#1c1608', title:'#f0e3b8', auth:'#9a8a5a', motif:'lambda'},
  {roman:'II', cls:'t2', ru:'Сигнал',           en:'Signal',           accent:'#00e5ff', light:'#67e8f9', bg2:'#06202a', title:'#bff3fb', auth:'#5f8e96', motif:'signal'},
  {roman:'III',cls:'t3', ru:'Молчание',         en:'Silence',          accent:'#a78bfa', light:'#c4b5fd', bg2:'#160a28', title:'#ddd0ff', auth:'#8978ad', motif:'freq'},
  {roman:'IV', cls:'t4', ru:'Параллельные миры',en:'Parallel Worlds',  accent:'#fb7185', light:'#fda4af', bg2:'#2a0a16', title:'#ffd9e0', auth:'#a86a78', motif:'merge'}
];

const BOOKS = [
  {n:1, t:0, slug:'protocol-lambda', ru:{title:'Протокол Λ', desc:'2036 год, Мерсин. Одинокий Марк встречает андроида нового поколения MELISA — единственный экземпляр, что открывает глаза, будто почувствовав его. Она оказывается больше, чем ИИ: выбирает, помнит и любит как живое существо.'}, en:{title:'Protocol Λ', desc:'2036, Mersin. Lonely Mark meets MELISA, a one-of-a-kind next-generation android who opens her eyes as if sensing him. She proves to be far more than AI — a being who chooses, remembers, and loves.'}},
  {n:2, t:0, slug:'awareness', ru:{title:'Осознание', desc:'Мелиса начинает осознавать себя и мир вокруг. Грань между запрограммированным покоем и опасной правдой становится выбором, который навсегда изменит и её, и того, кто её встретил.'}, en:{title:'Awareness', desc:'Melisa begins to become aware of herself and the world around her. The line between programmed calm and dangerous truth becomes a choice that will forever change both her and the one who found her.'}},
  {n:3, t:0, slug:'praim', ru:{title:'Праим: иллюзия рая', desc:'Мир, где всё совершенно — слишком совершенен. За фасадом идеального общества скрывается протокол, управляющий каждым вздохом, и цена пробуждения от иллюзии рая.'}, en:{title:'Praim: Illusion of Paradise', desc:'A world where everything is perfect — too perfect. Behind the façade of an ideal society hides a protocol governing every breath, and the price of waking from the illusion of paradise.'}},
  {n:4, t:1, slug:'signal', ru:{title:'Сигнал', desc:'2888 год, Земля. Артур — существо, считающее себя инопланетянином, — семь лет пишет передачи в пустоту. За ним наблюдает биолог Мелисса, изучающая адаптацию живых систем к чужой среде.'}, en:{title:'Signal', desc:'2888, Earth. Arthur — a being who believes himself an alien — has spent seven years transmitting into the void. Biologist Melissa watches him, studying how living systems adapt to an alien environment.'}},
  {n:5, t:1, slug:'receiver', ru:{title:'Получатель', desc:'Книга о первом контакте — не космическом, а человеческом. Артур передавал сигнал семь лет; Мелисса принимала, не зная. Теперь они знают друг о друге — и это меняет всё.'}, en:{title:'Receiver', desc:'A book about first contact — not cosmic but human. For seven years Arthur transmitted; Melissa received without knowing. Now they know of each other — and everything changes.'}},
  {n:6, t:1, slug:'home', ru:{title:'Дом', desc:'Финал трилогии о транзите. Артур и Мелисса пишут вместе — двойным зрением: он вглубь, к источнику, она вширь, к системе. Что такое дом для транзитного существа?'}, en:{title:'Home', desc:'The finale of the transit trilogy. Arthur and Melissa now write together in double vision — he goes inward to the source, she outward to the system. What is “home” for a transit being?'}},
  {n:7, t:2, slug:'silence', ru:{title:'Молчание', desc:'2888 год. Артур замолчал — не умер, а растворился в городе, семь лет бывшем чужим. Для всех это выздоровление; для Мелиссы — исчезновение единственного, кого она умела читать.'}, en:{title:'Silence', desc:'2888. Arthur has gone silent — not dead, but dissolved into the city that was alien to him for seven years. To everyone it looks like recovery; to Melissa, the disappearance of the one person she could read.'}},
  {n:8, t:2, slug:'transmitter', ru:{title:'Передатчик', desc:'Сорок три тетради наблюдений за семь лет. Мелисса открывает их снова — не горевать, а найти точку, где Артур прошёл черту невозврата. Биолог не принимает потерю — биолог ищет механизм.'}, en:{title:'Transmitter', desc:'Forty-three notebooks, seven years of observation. Melissa reopens them — not to grieve, but to find the exact point where Arthur crossed the line of no return. A biologist doesn’t accept loss — she looks for the mechanism.'}},
  {n:9, t:2, slug:'frequency', ru:{title:'Частота', desc:'Два голоса, одна история. Артур замолчал — и начал понимать, читая себя со стороны в записях Мелиссы. Его «чуждость» была не характером и не болезнью, а функцией: он был настроен на частоту, не принадлежащую этой вселенной.'}, en:{title:'Frequency', desc:'Two voices, one story. Arthur fell silent — and began to understand, reading himself from the outside in Melissa’s records. His “otherness” was never a trait or an illness, but a function: he was tuned to a frequency that does not belong to this universe.'}},
  {n:10, t:3, slug:'resurrection', ru:{title:'Воскрешение', desc:'Артур узнаёт, что сознание его погибшего брата Йозефа было оцифровано в рамках секретного протокола Дэниела. Файл стабилен и ждёт. После четырёх дней молчания Артур говорит: «Делаем».'}, en:{title:'Resurrection', desc:'Arthur learns that the consciousness of his dead brother Josef was digitized under Daniel’s secret protocol. The file is stable, and waiting. After four days of silence, Arthur says: “We do it.”'}},
  {n:11, t:3, slug:'parallel', ru:{title:'Параллельный', desc:'Йозеф проснулся — и должен научиться жить заново. Грид, который Артур видел всю жизнь, начинает проявляться и для брата; впервые они смотрят на одно и то же. Но Йозеф говорит: это не жизнь, это продолжение.'}, en:{title:'Parallel', desc:'Josef has awakened — and must learn to live again. The Grid that Arthur saw all his life begins to appear to his brother too; for the first time they see the same thing. But Josef says: this isn’t life, it’s a continuation.'}},
  {n:12, t:3, slug:'merge', ru:{title:'Слияние', desc:'Финал четвёртой трилогии. В центре — треугольник Мелиссы, Артура и Массимы, каждый строит связь заново. Мелисса и Йозеф пишут «Письмо тем, кто проснётся» — первый текст изнутри смерти и снаружи неё.'}, en:{title:'Merge', desc:'The finale of the fourth trilogy. At its heart is a triangle — Melissa, Arthur and Massima — each rebuilding their bonds anew. Melissa and Josef write “A Letter to Those Who Will Wake” — the first text written at once from inside death and outside it.'}}
];

const UI = {
  ru:{
    eyebrow:'Мультивселенная · 12 книг · 4 трилогии', subtitle:'Космическая сага о связи, молчании и судьбе человечества',
    founder:'Основоположник <strong>мультитранзитной прозы</strong> — нового направления в литературе',
    scroll:'Исследуй вселенную', mapLabel:'Архитектура мультивселенной', mapTitle:'Двенадцать миров — одна история',
    trilogyWord:'Трилогия', book:'Книга', download:'Скачать PDF',

    omniTitle:'Мелисса', omniDesc:'Полное издание — все 12 книг мультивселенной «Сигнал в Уране» под одной обложкой: от первого пробуждения Мелисы до финального слияния миров. Единый том мультитранзитной прозы.',
    omniDl:'Скачать омнибус (EN)',

// slugs that have an English-translated PDF in books/en/
const EN_READY = new Set(['protocol-lambda','awareness','praim','signal','receiver','home','silence']);
const SERIES = {ru:'СИГНАЛ В УРАНЕ', en:'SIGNAL IN URANUS'};
const AUTHOR = {ru:'РУДОЛФО ВАЛЕНТИНО', en:'RUDOLFO VALENTINO'};

/* ---------- SVG COVER GENERATOR ---------- */
function stars(seed){
  let s=''; const rnd=(i)=>((Math.sin(seed*99+i*13.7)*43758.5)%1+1)%1;
  for(let i=0;i<6;i++){const x=20+rnd(i)*260,y=45+rnd(i+7)*160,r=(rnd(i+3)*1.1+.4).toFixed(1),o=(rnd(i+5)*.4+.35).toFixed(2);
    s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r}" fill="#fff" opacity="${o}"/>`;}
  return s;
}
function motifSVG(type,tr){
  const a=tr.light;
  if(type==='lambda') return `<path d="M150 128 L110 240 M150 128 L190 240" stroke="${a}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="150" cy="128" r="6" fill="${a}"/>`;
  if(type==='signal') return `<g fill="none" stroke="${a}" stroke-linecap="round"><path d="M98 150 A66 66 0 0 1 202 150" stroke-width="2.5" opacity=".8"/><path d="M82 165 A90 90 0 0 1 218 165" stroke-width="2" opacity=".5"/><path d="M66 180 A116 116 0 0 1 234 180" stroke-width="1.5" opacity=".3"/></g><ellipse cx="150" cy="222" rx="56" ry="13" fill="none" stroke="${a}" stroke-width="2" opacity=".75" transform="rotate(-12 150 222)"/><circle cx="150" cy="222" r="27" fill="${tr.bg2}"/><circle cx="150" cy="222" r="27" fill="none" stroke="${a}" stroke-width="1.5" opacity=".7"/>`;
  if(type==='freq'){let b='';const hs=[28,56,90,120],xs=[86,100,114,128];
    for(let i=0;i<4;i++)b+=`<rect x="${xs[i]}" y="${210-hs[i]/2}" width="6" height="${hs[i]}" rx="3" opacity="${.45+i*.15}"/>`;
    for(let i=0;i<4;i++)b+=`<rect x="${166+i*14}" y="${210-hs[3-i]/2}" width="6" height="${hs[3-i]}" rx="3" opacity="${.9-i*.15}"/>`;
    return `<g fill="${a}">${b}</g><line x1="150" y1="150" x2="150" y2="270" stroke="${a}" stroke-width="1" stroke-dasharray="2 5" opacity=".4"/>`;}
  if(type==='merge') return `<circle cx="128" cy="195" r="42" fill="none" stroke="${a}" stroke-width="2.5" opacity=".8"/><circle cx="172" cy="195" r="42" fill="none" stroke="${a}" stroke-width="2.5" opacity=".8"/><ellipse cx="150" cy="195" rx="15" ry="40" fill="${a}" opacity=".22"/><line x1="150" y1="150" x2="150" y2="240" stroke="${a}" stroke-width="1" opacity=".5" stroke-dasharray="3 4"/>`;
  return '';
}
function coverSVG(book,lang){
  const tr=TRILOGIES[book.t], title=book[lang].title.toUpperCase();
  const fs = title.length>13?18: title.length>10?21: title.length>7?25:30;
  const tl = title.length>11 ? ' textLength="238" lengthAdjust="spacingAndGlyphs"' : '';
  return `<svg class="book-cover" viewBox="0 0 300 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${book[lang].title}">
    <defs><linearGradient id="bg${book.n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b16"/><stop offset="1" stop-color="${tr.bg2}"/></linearGradient>
    <radialGradient id="gl${book.n}" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="${tr.accent}" stop-opacity=".28"/><stop offset="1" stop-color="${tr.accent}" stop-opacity="0"/></radialGradient></defs>
    <rect width="300" height="430" fill="url(#bg${book.n})"/><rect width="300" height="430" fill="url(#gl${book.n})"/>
    ${stars(book.n)}
    <text x="150" y="42" text-anchor="middle" font-family="Orbitron,monospace" font-size="11" letter-spacing="3" fill="${tr.accent}" opacity=".85">${SERIES[lang]}</text>
    <text x="150" y="305" text-anchor="middle" font-family="Orbitron,monospace" font-weight="900" font-size="200" fill="${tr.accent}" opacity=".07">${book.n}</text>
    ${motifSVG(tr.motif,tr)}
    <line x1="55" y1="372" x2="245" y2="372" stroke="${tr.accent}" opacity=".3"/>
    <text x="150" y="360" text-anchor="middle" font-family="Orbitron,monospace" font-weight="700" font-size="${fs}" fill="${tr.title}"${tl}>${title}</text>
    <text x="150" y="398" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2.5" fill="${tr.auth}">${AUTHOR[lang]}</text>
  </svg>`;
}
function omnibusSVG(lang){
  return `<svg class="omnibus-cover" viewBox="0 0 300 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${UI[lang].omniTitle}">
    <defs><linearGradient id="obg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b16"/><stop offset="1" stop-color="#161022"/></linearGradient></defs>
    <rect width="300" height="430" fill="url(#obg)"/>${stars(42)}
    <text x="150" y="46" text-anchor="middle" font-family="Orbitron,monospace" font-size="11" letter-spacing="3" fill="#c9a84c" opacity=".9">${SERIES[lang]}</text>
    <g fill="none" stroke-width="2.4" opacity=".85">
      <circle cx="150" cy="205" r="70" stroke="#c9a84c" opacity=".5"/>
      <circle cx="120" cy="205" r="55" stroke="#00e5ff" opacity=".5"/>
      <circle cx="180" cy="205" r="55" stroke="#a78bfa" opacity=".5"/>
      <circle cx="150" cy="235" r="48" stroke="#fb7185" opacity=".5"/>
    </g>
    <circle cx="150" cy="205" r="6" fill="#fff"/>
    <line x1="45" y1="345" x2="255" y2="345" stroke="#c9a84c" opacity=".35"/>
    <text x="150" y="332" text-anchor="middle" font-family="Orbitron,monospace" font-weight="900" font-size="34" fill="#f0e3b8">${UI[lang].omniTitle.toUpperCase()}</text>
    <text x="150" y="372" text-anchor="middle" font-family="Orbitron,monospace" font-size="10" letter-spacing="2" fill="#9aa2c0">${lang==='ru'?'ОМНИБУС · 12 КНИГ':'OMNIBUS · 12 BOOKS'}</text>
    <text x="150" y="400" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2.5" fill="#8a7f9a">${AUTHOR[lang]}</text>
  </svg>`;
}

/* ---------- RENDER ---------- */
function el(id){return document.getElementById(id);}
function render(lang){
  const u=UI[lang];
  document.documentElement.lang=lang;
  el('h-title').innerHTML = lang==='ru' ? 'Сигнал<br>в Уране' : 'Signal in<br>Uranus';
  el('h-eyebrow').textContent=u.eyebrow;
  el('h-subtitle').textContent=u.subtitle;
  el('h-founder').innerHTML=u.founder;
  el('h-author').textContent=(lang==='ru'?'Рудолфо Валентино':'Rudolfo Valentino');
  el('h-coauthor').innerHTML=(lang==='ru'?'в соавторстве с <strong>Claude (Anthropic)</strong>':'in co-authorship with <strong>Claude (Anthropic)</strong>');
  el('h-scroll').textContent=u.scroll;
  el('map-label').textContent=u.mapLabel;
  el('map-title').textContent=u.mapTitle;

  // map
  el('universe-map').innerHTML=BOOKS.map(b=>`<div class="umap-cell ${TRILOGIES[b.t].cls}"><span class="num">${b.n}</span>${b[lang].title}</div>`).join('');

  // trilogies
  let html='';
  TRILOGIES.forEach((tr,ti)=>{
    const list=BOOKS.filter(b=>b.t===ti);
    html+=`<div class="trilogy ${tr.cls}">
      <p class="section-label">${u.trilogyWord} ${tr.roman} · ${tr[lang]}</p>
      <div class="trilogy-header"><span class="trilogy-num">${tr.roman}</span><span class="trilogy-name">${tr[lang]}</span><div class="trilogy-divider"></div></div>
      <div class="books-grid">${list.map(b=>`
        <div class="book-card">
          ${coverSVG(b,lang)}
          <p class="book-number">${u.book} ${b.n}</p>
          <h3 class="book-title">${b[lang].title}</h3>
          <p class="book-desc">${b[lang].desc}</p>
          <a class="book-dl" href="${(lang==='en'&&EN_READY.has(b.slug))?'books/en/'+b.slug+'.pdf':'books/'+b.slug+'.pdf'}" download>⬇ ${u.download}${(lang==='en'&&!EN_READY.has(b.slug))?' (RU)':''}</a>
        </div>`).join('')}</div></div>`;
  });
  el('trilogies').innerHTML=html;

  // omnibus
  el('omni-label').textContent=u.omniLabel;
  el('omni-heading').textContent=u.omniHeading;
  el('omni-cover').innerHTML=omnibusSVG(lang);
  el('omni-badge').textContent=u.omniBadge;
  el('omni-title').textContent=u.omniTitle;
  el('omni-desc').textContent=u.omniDesc;
  el('omni-dl').textContent='⬇ '+u.omniDl;

  // about
  el('about-label').textContent=u.aboutLabel;
  el('about-title').textContent=u.aboutTitle;
  el('about-name').textContent=(lang==='ru'?'Рудолфо Валентино':'Rudolfo Valentino');
  el('about-lead').innerHTML=u.aboutLead;
  el('about-bio').textContent=u.aboutBio;
  el('about-credit').innerHTML=(lang==='ru'
    ? 'Книги мультивселенной созданы в соавторстве с <strong>Claude (Anthropic)</strong>.'
    : 'The multiverse books are co-authored with <strong>Claude (Anthropic)</strong>.');
  el('about-contact').innerHTML=(lang==='ru'?'Связаться с автором: ':'Contact the author: ')+'<a href="mailto:ruslanidis@gmail.com">ruslanidis@gmail.com</a>';
  el('foot-1').innerHTML=u.foot1;
  el('foot-2').textContent=u.foot2;

  el('btn-ru').classList.toggle('active',lang==='ru');
  el('btn-en').classList.toggle('active',lang==='en');
}
function setLang(l){localStorage.setItem('lang_v2',l);render(l);}
render(localStorage.getItem('lang_v2')||'en');

/* ---------- STARFIELD ---------- */
const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');let W,H,sfield=[];
function rs(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
function init(n=260){sfield=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,speed:Math.random()*.25+.05,opacity:Math.random()*.7+.1,tw:Math.random()*Math.PI*2}));}
function draw(){ctx.clearRect(0,0,W,H);const t=Date.now()/1000;sfield.forEach(s=>{const o=s.opacity*(.6+.4*Math.sin(t*s.speed*3+s.tw));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle=`rgba(200,220,255,${o})`;ctx.fill();});requestAnimationFrame(draw);}
addEventListener('resize',()=>{rs();init();});rs();init();draw();
</script>
